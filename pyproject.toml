[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docsight"
version = "0.1.0"
description = "Extract text and images from Word, Excel, PowerPoint, PDF, RTF, ODF, email and archives for vision-LLM pipelines"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Manish Khanal", email = "manishkhanal1989@gmail.com" }]
license = { text = "MIT" }
keywords = [
  "docx", "xlsx", "pptx", "rtf", "odf", "pdf", "ocr", "vision", "vlm",
  "document-extraction", "document-ai", "qwen-vl", "idp", "verification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Markup",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Utilities",
  "Typing :: Typed",
]

# The .docx path -- the one that matters most here -- is pure stdlib.
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.23"]
images = ["pillow>=10.0", "pillow-heif>=0.15"]
llm = ["openai>=1.30"]
all = ["pymupdf>=1.23", "pillow>=10.0", "pillow-heif>=0.15", "openai>=1.30"]
dev = [
  "pymupdf>=1.23", "pillow>=10.0", "pillow-heif>=0.15", "openai>=1.30",
  "pytest>=7.0", "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/manishkhanal1989/docsight"
Repository = "https://github.com/manishkhanal1989/docsight"
Issues = "https://github.com/manishkhanal1989/docsight/issues"

[project.scripts]
docsight = "docsight.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["docsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
